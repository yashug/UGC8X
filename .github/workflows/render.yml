name: Render UGC video

# Dispatched by the app when a render is queued. Vercel functions cannot stay
# alive long enough to render video; a runner can, and Actions minutes are free.
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Job id to render
        required: true
      payloadUrl:
        description: URL of the render payload JSON in R2
        required: true
      callbackUrl:
        description: Where to report the finished video
        required: true

concurrency:
  group: render-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Full install, not --omit=dev: Remotion compiles the .tsx composition on
      # the runner, and trimming dev dependencies is exactly the kind of thing
      # that works locally and fails only in CI. Actions minutes are free.
      - name: Install dependencies
        run: npm ci

      # Chrome Headless Shell is ~90MB and dominates cold start, so it is cached
      # across runs. This is the main thing standing between a 3-minute render
      # and a 90-second one.
      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Fetch render payload
        run: curl -fsSL "${{ inputs.payloadUrl }}" -o payload.json

      - name: Render
        run: node scripts/render-worker.mjs
        env:
          JOB_ID: ${{ inputs.jobId }}
          CALLBACK_URL: ${{ inputs.callbackUrl }}
          RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      - name: Report failure
        if: failure()
        run: node scripts/render-report-failure.mjs
        env:
          JOB_ID: ${{ inputs.jobId }}
          CALLBACK_URL: ${{ inputs.callbackUrl }}
          RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
